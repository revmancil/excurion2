<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | {{ORG_NAME}}</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="js/memberforge-client.js"></script>
  <script src="js/org-context.js"></script>
  <script src="js/auth.js"></script>
  <style>
    body.mf-branded { background: var(--ink); }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-wrap { position: relative; z-index: 2; width: 100%; max-width: 440px; }
    .auth-brand { text-align: center; margin-bottom: 32px; }
    .auth-brand img { height: 72px; width: 72px; object-fit: contain; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); margin-bottom: 14px; background: rgba(255,255,255,0.04); }
    .auth-brand h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .auth-brand p { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
    .auth-card { background: #111; border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent); border-radius: 10px; padding: 36px 32px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .card-sub { font-size: 0.83rem; color: rgba(255,255,255,0.4); margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 7px; }
    .input-wrap { position: relative; }
    .input-wrap i.icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.25); font-size: 0.85rem; }
    .input-wrap input { width: 100%; padding: 12px 42px 12px 38px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: all 0.2s; }
    .input-wrap input:focus { outline: none; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.2); }
    .toggle-pw { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 0.85rem; padding: 4px; }
    .toggle-pw:hover { color: var(--accent); }
    .msg { display: none; align-items: center; gap: 8px; border-radius: 6px; padding: 11px 14px; font-size: 0.83rem; margin-bottom: 16px; }
    .msg.show { display: flex; }
    .msg.error { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; }
    .msg.success { background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.3); color: #27ae60; }
    .auth-submit { width: 100%; padding: 13px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .auth-submit:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: var(--shadow-accent); }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 15px; height: 15px; border: 2px solid rgba(0,0,0,0.3); border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .auth-links { margin-top: 20px; text-align: center; }
    .auth-links a { font-size: 0.82rem; color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.2s; }
    .auth-links a:hover { color: var(--accent); }
    .auth-links a i { margin-right: 6px; }
    .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
    .invalid-state { text-align: center; padding: 20px 0; }
    .invalid-state i { font-size: 2rem; color: rgba(231,76,60,0.6); margin-bottom: 12px; display: block; }
    .invalid-state p { color: rgba(255,255,255,0.45); font-size: 0.88rem; line-height: 1.6; }
    @media (max-width: 480px) { .auth-card { padding: 28px 18px; } }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img data-mf="org_logo" src="images/default-logo.svg" alt="Organization logo" />
      <h1 data-mf="org_name">Organization</h1>
      <p><span data-mf-term="member_noun">Member</span> Portal</p>
    </div>

    <div class="auth-card">
      <div id="formSection" style="display:none;">
        <div class="card-title">Set New Password</div>
        <p class="card-sub">Choose a strong password for your account.</p>
        <div class="msg error" id="resetError"><i class="fas fa-exclamation-circle"></i><span id="resetErrorText">An error occurred.</span></div>
        <div class="msg success" id="resetSuccess"><i class="fas fa-check-circle"></i><span>Password updated! Redirecting to login…</span></div>
        <form id="resetForm" novalidate>
          <div class="form-group">
            <label>New Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock icon"></i>
              <input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password" required />
              <button type="button" class="toggle-pw" data-toggle="newPassword"><i class="fas fa-eye"></i></button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock icon"></i>
              <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" required />
              <button type="button" class="toggle-pw" data-toggle="confirmPassword"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="auth-submit" id="resetBtn"><i class="fas fa-key"></i> Update Password</button>
        </form>
      </div>
      <div id="invalidSection" style="display:none;">
        <div class="invalid-state">
          <i class="fas fa-link-slash"></i>
          <p>This password reset link is invalid or has expired.<br>Please request a new one from the login page.</p>
        </div>
        <a href="member-login.html" class="auth-submit" id="invalidBackLink" style="margin-top:20px;text-decoration:none;"><i class="fas fa-arrow-left"></i> Back to Login</a>
      </div>
    </div>

    <div class="auth-links">
      <a href="index.html" id="backToSiteLink"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>
</div>

<script>
  function withOrgParam(path) {
    const search = window.location.search;
    return search ? `${path}${search}` : path;
  }

  // Parse token from URL hash: #access_token=...&type=recovery
  function parseHash() {
    const hash = window.location.hash.replace(/^#/, '');
    const params = {};
    hash.split('&').forEach(pair => {
      const parts = pair.split('=');
      if (parts.length === 2) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
    });
    return params;
  }

  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const el = document.getElementById(btn.dataset.toggle);
      const icon = btn.querySelector('i');
      el.type = el.type === 'password' ? 'text' : 'password';
      icon.className = el.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });
  });

  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    const tx = document.getElementById(id + 'Text');
    if (tx && text) tx.textContent = text;
    el.className = 'msg ' + type + ' show';
  }
  function hideMsg(id) { document.getElementById(id).classList.remove('show'); }
  function setLoading(loading) {
    const btn = document.getElementById('resetBtn');
    btn.disabled = loading;
    btn.innerHTML = loading ? '<div class="spinner"></div> Updating…' : '<i class="fas fa-key"></i> Update Password';
  }

  document.getElementById('newPassword').addEventListener('input', function () {
    const val = this.value;
    let score = 0;
    if (val.length >= 8) score++;
    if (val.length >= 12) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const fill = document.getElementById('strengthFill');
    const pct = (score / 5) * 100;
    const color = score <= 1 ? '#e74c3c' : score <= 2 ? '#f39c12' : score <= 3 ? '#f1c40f' : '#27ae60';
    fill.style.width = pct + '%';
    fill.style.background = color;
  });

  (async function () {
    const org = await MF.ready;
    if (!org) return; // org-context.js already rendered the "not found" page

    document.getElementById('backToSiteLink').href = withOrgParam('index.html');
    document.getElementById('invalidBackLink').href = withOrgParam('member-login.html');

    const hashParams = parseHash();
    const accessToken = hashParams['access_token'];
    const tokenType = hashParams['type'];

    if (!accessToken || tokenType !== 'recovery') {
      document.getElementById('invalidSection').style.display = 'block';
      return;
    }
    document.getElementById('formSection').style.display = 'block';

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideMsg('resetError'); hideMsg('resetSuccess');
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword.length < 8) { showMsg('resetError', 'error', 'Password must be at least 8 characters.'); return; }
      if (newPassword !== confirmPassword) { showMsg('resetError', 'error', 'Passwords do not match.'); return; }

      setLoading(true);
      try {
        await MFAuth.completePasswordReset(newPassword, accessToken);
        showMsg('resetSuccess', 'success');
        setTimeout(() => { window.location.href = withOrgParam('member-login.html'); }, 2000);
      } catch (err) {
        showMsg('resetError', 'error', err.message || 'Failed to update password.');
      } finally {
        setLoading(false);
      }
    });
  })();
</script>

</body>
</html>
